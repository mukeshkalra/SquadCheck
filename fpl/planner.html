<!--
  TRANSFER PLANNER (work in progress, built in chunks). This file holds the page shell, the squad handover,
  the Game plan screen, player search, the constraints and the Explore screen. Compare, Your call and Review
  come later.

  SQUAD HANDOVER CONTRACT (writer is added to the results page in a later chunk; nothing writes it yet)
    sessionStorage["squadcheck.planner.handoff.v1"] = JSON.stringify({
      v: 1,
      squad_ids: [15 unique FPL element ids],   // the scan result's players[].player_id, starters and bench
      gameweek: 7 | null,                       // the scan result's gameweek
      created: Date.now()                       // handovers older than 12 hours are ignored
    })
  Without a valid handover the page shows "start from your team check" and links back to the app.

  GATE: Inspect on any plan except Hold asks the user to share on WhatsApp. We cannot see whether a message was sent,
  so the page says so and continues on the user's word ("I've shared it"). Unlock lasts for the browser session.
  YOUR CALL: "Back this plan" records the choice for this visit only (in memory, never in storage or on a server).
  Sign-in is a non-persisting stub: nothing is saved, sent or retrievable later, and the page says so.
  EDITED PLAN: "Use this version" sets the working plan. Explore shows it apart from the original ranking, never inside it.
  TWEAKS: each of the four what-ifs is a real POST /api/transfer-plan built from the request behind the plan on screen.
  DATA: GET /api/players (player directory) and POST /api/transfer-plan (the plans shown on Explore).
  Every number on Explore is planner output. Three measures are kept apart and labelled:
    gain before hits   projected_gain_before_hits   (before any points hit)
    net gain           projected_gain_vs_hold       (after hit costs; plans are ranked by this)
    outlook            outlook.vs_hold              (GW+1..GW+3 best-XI difference vs hold, before hits, provisional)
  The default gain covers the next gameweek only (inputs.weights), never three gameweeks.

  STRATEGY LABEL -> API (see STRATEGIES in the core below)
    "I have a player in mind"  moves[]                    (no strategy value)
    "Worth a hit?"             strategy "everything" + max_hits >= 1   (ranked by net gain after hit costs)
    "Keep it sensible"         strategy "sensible"        (no points hits)
    "Show me everything"       strategy "everything"      (the default behaviour)
  There is no upside or ceiling metric in the planner, so nothing here claims one.
-->

<style>
:root{
  --lime:#CCFF00; --lime-t:rgba(204,255,0,.09); --lime-b:rgba(204,255,0,.28);
  --dark:#0A0A0C; --d2:#111114; --d3:#1A1A1F; --d4:#252530;
  --white:#F0F0F2; --gray:#8A8A96; --gray2:#5C5C68;
  --coral:#FF6B4A; --coral-t:rgba(255,107,74,.12);
  --amber:#FFB547; --amber-t:rgba(255,181,71,.12);
  --border:rgba(240,240,242,.07); --border2:rgba(240,240,242,.14);
  --r:14px; --r-sm:10px; --r-lg:20px;
  --font:'Outfit',system-ui,sans-serif; --mono:'DM Mono',ui-monospace,monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--dark);color:var(--white);font-family:var(--font);-webkit-font-smoothing:antialiased;line-height:1.5;min-height:100vh}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
a{color:inherit;text-decoration:none}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.nav{position:sticky;top:0;z-index:50;background:rgba(10,10,12,.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.nav-in{max-width:460px;margin-inline:auto;padding:12px 18px 0;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-size:18px;font-weight:900;letter-spacing:-.03em}.brand span{color:var(--lime)}
.backres{font-size:14px;font-weight:800;color:var(--lime)}.backres[hidden],.brand[hidden]{display:none}
.fbq{font-size:14px;font-weight:800;margin-top:20px}.fbg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.fbb{padding:14px 6px;background:var(--d2);border:1px solid var(--border2);border-radius:12px;font-size:14px;font-weight:800;color:var(--white);cursor:pointer}.fbb.sel{border-color:var(--lime);background:var(--lime-t)}
.chips{display:flex;gap:6px;align-items:center}
.gw{font-size:12px;font-weight:800;color:var(--lime);border:1px solid var(--lime-b);background:var(--lime-t);padding:4px 11px;border-radius:99px}
.stepper{max-width:460px;margin-inline:auto;padding:14px 12px 12px;display:grid;grid-template-columns:repeat(5,1fr);position:relative}
.stepper::before{content:"";position:absolute;left:10%;right:10%;top:23px;height:1px;background:var(--d4)}
.stp{background:transparent;border:0;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;font-size:10.5px;font-weight:600;color:var(--gray2);padding:0;cursor:default}
.stp i{width:19px;height:19px;border-radius:50%;background:var(--d3);border:1.5px solid var(--d4);display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:800}
.stp.done{cursor:pointer}.stp.done i{background:var(--lime-t);border-color:var(--lime-b);color:var(--lime)}.stp.done{color:var(--gray)}
.stp.on{color:var(--lime)}.stp.on i{background:var(--lime);border-color:var(--lime);color:#000;box-shadow:0 0 14px rgba(204,255,0,.4)}

main{max-width:460px;margin-inline:auto;padding:22px 18px calc(48px + env(safe-area-inset-bottom,0px))}
h1.h{font-size:32px;font-weight:900;letter-spacing:-.035em;line-height:1.05;text-wrap:balance}
.sub{color:var(--gray);font-size:14px;margin-top:8px}
.sec{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gray);margin:26px 2px 10px}
.fine{font-size:11.5px;color:var(--gray2);line-height:1.5}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:16px;background:var(--lime);border:0;border-radius:var(--r-sm);font-size:15px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;color:#000;box-shadow:0 4px 20px rgba(204,255,0,.2);transition:background .14s}
.btn:hover{background:#d4ff1a}
.btn:disabled{opacity:.35;pointer-events:none;box-shadow:none}
.btn2{display:flex;align-items:center;justify-content:center;width:100%;padding:14px;background:transparent;border:1.5px solid var(--border2);border-radius:var(--r-sm);font-size:14px;font-weight:800}
.btn2:hover{border-color:var(--lime-b);background:var(--lime-t)}
.help{font-size:12.5px;color:var(--gray);text-align:center;margin-top:10px}
.stack{display:flex;flex-direction:column;gap:9px;margin-top:20px}
.card{background:var(--d2);border:1px solid var(--border);border-radius:var(--r);padding:14px}
.note{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:10px 12px;border-radius:var(--r-sm);background:var(--amber-t);border:1px solid rgba(255,181,71,.3);color:var(--amber);font-size:12.5px}
.note.bad{background:var(--coral-t);border-color:rgba(255,107,74,.3);color:var(--coral)}

/* player photo: same CDN and fallback as the results page */
.phw{position:relative;display:inline-grid;place-items:center;width:var(--pw,36px);height:var(--pht,46px);border-radius:8px;background:var(--d3);border:1px solid var(--border);overflow:hidden;flex:none;font-size:10px;font-weight:800;color:var(--gray)}
.phw::before{content:attr(data-ini)}
.phw img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top center}
.phw.sm{--pw:30px;--pht:38px}.phw.xs{--pw:26px;--pht:33px}

details.squad{margin-top:16px;background:var(--d2);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px}
details.squad summary{font-size:13px;font-weight:700;color:var(--gray);cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.strip{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 4px;scrollbar-width:thin}
.strip .p{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:54px;font-size:10.5px;color:var(--gray)}
.strip .p b{color:var(--white);font-weight:600;max-width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.strats{display:flex;flex-direction:column;gap:9px;margin-top:20px}
.strat{border:1.5px solid var(--border);background:var(--d2);border-radius:var(--r);transition:border-color .15s,background .15s}
.strat:hover{border-color:var(--border2)}
.strat.on{border-color:var(--lime);background:var(--lime-t);box-shadow:0 0 28px rgba(204,255,0,.1)}
.sh{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:transparent;border:0;padding:14px}
.ico{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--d3);color:var(--lime)}
.strat.on .ico{background:var(--lime-t)}
.sh .nm{font-weight:800;font-size:16px;display:block}.sh .ds{font-size:12.5px;color:var(--gray);line-height:1.35}
.grow{flex:1;min-width:0}
.chev{flex:none;color:var(--gray2);transition:transform .2s}.strat.on.open .chev{transform:rotate(90deg);color:var(--lime)}
.sbody{padding:0 14px 14px}
.mrow{background:var(--d2);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px;margin-top:8px}
.mrow .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.mrow .hd .l{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gray)}
.mrow .hd button{background:transparent;border:0;color:var(--gray);font-size:12px;font-weight:700}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:400px){.mgrid{grid-template-columns:1fr}}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.fld.s>span{color:var(--coral)}.fld.b>span{color:var(--lime)}
.combo{position:relative}
.cin{width:100%;background:var(--d3);border:1px solid var(--border2);border-radius:10px;padding:10px 11px;font-size:14px}
.cin::placeholder{color:var(--gray2)}
.clist{display:none;position:absolute;z-index:30;left:0;right:0;top:calc(100% + 4px);background:var(--d3);border:1px solid var(--border2);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.6);max-height:260px;overflow-y:auto;min-width:230px}
.combo.open .clist{display:block}
.copt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--border);padding:8px 10px}
.copt:last-child{border-bottom:0}
.copt.hi,.copt:hover{background:var(--d4)}
.copt .nm{font-weight:700;font-size:14px;display:block}.copt .mt{font-size:11.5px;color:var(--gray)}
.cnone{padding:12px;font-size:12.5px;color:var(--gray)}
.chosen{display:flex;align-items:center;gap:9px;background:var(--d3);border:1px solid var(--lime-b);border-radius:10px;padding:6px 8px}
.chosen .nm{font-weight:700;font-size:13.5px;display:block;line-height:1.2}.chosen .mt{font-size:11px;color:var(--gray)}
.chosen button{margin-left:auto;background:transparent;border:0;color:var(--gray);font-size:18px;line-height:1;padding:4px 6px}
.addmv{width:100%;margin-top:8px;background:transparent;border:1px dashed var(--border2);border-radius:var(--r-sm);padding:10px;font-size:13px;font-weight:700;color:var(--gray)}
.addmv:hover{color:var(--white);border-color:var(--lime-b)}

.ctl{margin-top:6px;background:var(--d2);border:1px solid var(--border);border-radius:var(--r);padding:4px 14px}
.cr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.cr:last-child{border-bottom:0}
.cr .q{font-weight:700;font-size:14.5px}.cr .h{font-size:11.5px;color:var(--gray)}
.step{display:flex;align-items:center;gap:4px}
.step button{width:38px;height:38px;border-radius:10px;border:1px solid var(--border2);background:var(--d3);font-size:19px;font-weight:700}
.step button:disabled{opacity:.3;cursor:not-allowed}
.step output{min-width:32px;text-align:center;font-family:var(--mono);font-size:19px}
.money{display:flex;align-items:center;gap:6px;background:var(--d3);border:1px solid var(--border2);border-radius:10px;padding:0 10px;height:38px;color:var(--gray);font-family:var(--mono)}
.money input{width:56px;background:transparent;border:0;font-family:var(--mono);font-size:17px;text-align:right}
.money.bad{border-color:var(--coral)}
.req{margin-left:7px;font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--gray2)}
.cr.need .req{color:var(--amber)}
.cr.need .h{color:var(--amber)}
.cr.need .money{border-color:var(--amber)}
.cr.need .seg3{border-color:var(--amber)}
.seg3{display:flex;background:var(--d3);border:1px solid var(--border2);border-radius:10px;padding:3px;gap:2px}
.seg3 button{border:0;background:transparent;border-radius:8px;padding:7px 9px;font-size:12.5px;font-weight:700;color:var(--gray);font-family:var(--mono)}
.seg3 button.on{background:var(--lime);color:#000}
.seg3 button:disabled{opacity:.3;cursor:not-allowed;text-decoration:line-through}

.loading{display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:70px;text-align:center}
.ring{width:56px;height:56px;border-radius:50%;border:3px solid var(--d4);border-top-color:var(--lime);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.ring{animation:none}*{transition:none!important}}
pre.req{background:var(--d2);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px;font-family:var(--mono);font-size:11.5px;color:var(--gray);overflow-x:auto;white-space:pre-wrap;word-break:break-all;margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--lime);background:var(--lime-t);border:1px solid var(--lime-b);padding:4px 10px;border-radius:99px}
.sr{position:absolute;left:-9999px}
.lbl{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gray2)}
.hero2{text-align:center;padding:6px 0 2px}
.hero2 .pill2{display:inline-block;font-size:12px;font-weight:700;color:var(--gray);border:1px solid var(--border2);padding:5px 16px;border-radius:99px;background:var(--d2)}
.hero2 h1{font-size:42px;font-weight:900;letter-spacing:-.04em;line-height:1;margin-top:14px;text-wrap:balance}
.hero2 h1 span{color:var(--lime)}
.recnote{margin-top:12px;padding:10px 12px;border-radius:var(--r-sm);background:var(--d3);font-size:12.5px;color:var(--gray);text-align:center}
textarea{width:100%;min-height:92px;resize:vertical;background:var(--d3);border:1px solid var(--border2);border-radius:var(--r-sm);padding:12px;color:var(--white);font-family:var(--font);font-size:14px;line-height:1.45;margin-top:8px}
.projnote{display:flex;gap:10px;margin-top:14px;padding:11px 12px;border-radius:var(--r-sm);background:var(--d3);font-size:12.5px;color:var(--gray)}
.projnote b{color:var(--white)}
.gain{margin-top:18px;border:1.5px solid var(--lime-b);background:linear-gradient(150deg,var(--lime-t),rgba(10,10,12,0) 80%),var(--d2);border-radius:var(--r-lg);padding:16px}
.gh{font-size:20px;font-weight:900;letter-spacing:-.025em;line-height:1.15;text-wrap:balance}
.gb{display:flex;gap:12px;align-items:flex-start;margin-top:12px}
.gi{flex:none;width:30px;height:30px;border-radius:10px;background:var(--lime-t);border:1px solid var(--lime-b);color:var(--lime);display:grid;place-items:center;font-size:13px}
.gb b{font-size:14.5px;display:block;line-height:1.25}.gb p{font-size:12.5px;color:var(--gray);margin-top:2px}
.signnote{margin-top:12px;padding:10px 12px;border-radius:var(--r-sm);background:var(--amber-t);border:1px solid rgba(255,181,71,.3);color:var(--amber);font-size:12.5px}
.scard{border-radius:var(--r);padding:16px;background:linear-gradient(150deg,#16181a,#0d0e10);border:1px solid var(--lime-b);margin-top:12px}
.scard .tt{font-size:24px;font-weight:900;letter-spacing:-.03em;line-height:1.1;margin-top:8px;color:var(--lime)}
.scrimx{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:80}
.sheetx{position:fixed;left:0;right:0;bottom:0;z-index:90;max-width:460px;margin-inline:auto;background:var(--d3);border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--border2);max-height:90vh;overflow-y:auto}
.sheetx h4{font-size:17px;font-weight:800;margin-bottom:10px}
.gmark{width:22px;height:22px;border-radius:50%;background:#fff;color:#4285F4;display:grid;place-items:center;font-size:14px;font-weight:900;text-transform:none}
.orsep{display:flex;align-items:center;gap:10px;margin:14px 0 10px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gray2)}
.orsep::before,.orsep::after{content:"";flex:1;height:1px;background:var(--border2)}
.optin{display:flex;align-items:center;gap:10px;font-size:13px;margin:0 0 12px;cursor:pointer}
.optin input{accent-color:var(--lime);width:18px;height:18px;flex:none}
.cin{width:100%;background:var(--d3);border:1px solid var(--border2);border-radius:10px;padding:10px 11px;font-size:14px}
.devband{margin:-6px 0 16px;padding:8px 12px;border-radius:var(--r-sm);background:var(--amber-t);border:1px dashed rgba(255,181,71,.55);color:var(--amber);font-size:12px;font-weight:800;letter-spacing:.04em;text-align:center}
.gw.dev{color:var(--amber);border-color:rgba(255,181,71,.5);background:var(--amber-t)}
.cr .h.warnc{color:var(--amber)}
.verdict{margin-top:16px;padding:14px;border-radius:var(--r);background:var(--d2);border:1px solid var(--border2)}
.verdict b{font-size:17px;display:block;margin-top:2px}
.verdict p{font-size:13px;color:var(--gray);margin-top:4px}
.plans{display:flex;flex-direction:column;gap:11px;margin-top:16px}
.plan{--c:#C9CBD6;--ct:rgba(255,255,255,.04);position:relative;width:100%;text-align:left;background:linear-gradient(150deg,var(--ct),rgba(10,10,12,0) 70%),var(--d2);border:1.5px solid color-mix(in srgb,var(--c) 40%,transparent);border-radius:var(--r-lg);padding:14px;transition:border-color .15s;cursor:pointer}
.plan:hover{border-color:color-mix(in srgb,var(--c) 70%,transparent)}
.plan.sel-on{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 0 30px color-mix(in srgb,var(--c) 22%,transparent)}
.plan.lime{--c:var(--lime);--ct:var(--lime-t)}
.plan.gray{--c:#9AA3B2;--ct:rgba(154,163,178,.09)}

<body>

<header class="nav">
  <div class="nav-in"><a class="brand" id="brand" href="./" aria-label="SquadCheck home">Squad<span>Check</span></a><a class="backres" id="backres" href="./?view=results" hidden>← Your results</a><div class="chips" id="chips"></div></div>
  <nav class="stepper" id="stepper" aria-label="Planner steps"></nav>
</header>
<main id="main" aria-live="polite"></main>
<noscript><main><h1 class="h">Transfer Planner</h1><p class="sub">This page needs JavaScript.</p></main></noscript>

<script>
/* CORE:BEGIN  (pure logic, no DOM: unit-tested by fpl/engine/tests/test_planner_page.py) */
const PlannerCore = (function () {
  const POS = {1: 'GKP', 2: 'DEF', 3: 'MID', 4: 'FWD'};
  const COMPOSITION = {1: 2, 2: 5, 3: 5, 4: 3};
  const MAX_MOVES = 3;                 // free transfers + hits, a UI cap (the planner itself is not capped)
  const HANDOFF_KEY = 'squadcheck.planner.handoff.v1';
  const STATE_KEY = 'squadcheck.planner.state.v1';
  const HANDOFF_MAX_AGE_MS = 12 * 3600 * 1000;
  // UI label -> API. "hit" is "Worth a hit?": hits allowed, ranked by net gain after hit costs.
  const STRATEGIES = {
    mind:     {api: null,         label: 'I have a player in mind'},
    hit:      {api: 'everything', label: 'Worth a hit?'},
    sensible: {api: 'sensible',   label: 'Keep it sensible'},
    all:      {api: 'everything', label: 'Show me everything'}
  };

  // The sample-squad shortcut is for local development only: ?dev=1 does nothing on any real host.
  const devMode = (search, hostname) => new URLSearchParams(search).get('dev') === '1' && (hostname === 'localhost' || hostname === '127.0.0.1' || hostname === '[::1]');
  const isInt = v => typeof v === 'number' && Number.isInteger(v);
  const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

  function parseHandoff(raw, now) {
    let o = raw;
    if (typeof raw === 'string') { try { o = JSON.parse(raw); } catch (e) { return {ok: false, reason: 'unreadable'}; } }
    if (!o || typeof o !== 'object' || o.v !== 1) return {ok: false, reason: 'unreadable'};
    const ids = o.squad_ids;
    if (!Array.isArray(ids) || ids.length !== 15 || ids.some(x => !isInt(x) || x <= 0) || new Set(ids).size !== 15)
      return {ok: false, reason: 'squad'};
    if (o.gameweek !== null && o.gameweek !== undefined && !(isInt(o.gameweek) && o.gameweek > 0 && o.gameweek < 60))
      return {ok: false, reason: 'unreadable'};
    if (typeof o.created !== 'number' || !isFinite(o.created) || o.created > now + 60000) return {ok: false, reason: 'unreadable'};
    if (now - o.created > HANDOFF_MAX_AGE_MS) return {ok: false, reason: 'stale'};
    return {ok: true, squad_ids: ids.slice(), gameweek: o.gameweek == null ? null : o.gameweek, dev: o.dev === true};
  }

  /** Validate the /api/players payload; keep only usable entries. */
  function indexDirectory(payload) {
    if (!payload || payload.status !== 'OK' || !Array.isArray(payload.players)) return {ok: false};
    const players = [], byId = {};
    for (const p of payload.players) {
      if (!p || !isInt(p.id) || typeof p.name !== 'string' || !p.name.trim() || ![1, 2, 3, 4].includes(p.position)
          || !isInt(p.team) || !isInt(p.price) || p.price <= 0 || byId[p.id]) continue;
      const d = {id: p.id, name: p.name.trim(), team: p.team, pos: p.position, price: p.price,
                 teamShort: typeof p.team_short === 'string' ? p.team_short : null,
                 teamName: typeof p.team_name === 'string' ? p.team_name : null,
                 code: isInt(p.photo_code) && p.photo_code > 0 ? p.photo_code : null, key: norm(p.name.trim())};
      byId[d.id] = d; players.push(d);
    }
    return players.length >= 15 ? {ok: true, players, byId, gameweek: isInt(payload.gameweek) ? payload.gameweek : null} : {ok: false};
  }

  /** The squad must exist in the directory and be a legal FPL squad. Returns a list of problems. */
  function validateSquad(ids, byId) {
    const problems = [], counts = {1: 0, 2: 0, 3: 0, 4: 0}, clubs = {};
    for (const id of ids) {
      const p = byId[id];
      if (!p) { problems.push('Player ' + id + ' is not in the FPL player list.'); continue; }
      counts[p.pos]++; clubs[p.team] = (clubs[p.team] || 0) + 1;
    }
    if (problems.length) return problems;
    for (const pos of [1, 2, 3, 4])
      if (counts[pos] !== COMPOSITION[pos]) problems.push('Expected ' + COMPOSITION[pos] + ' ' + POS[pos] + 's, found ' + counts[pos] + '.');
    if (Math.max(...Object.values(clubs)) > 3) problems.push('More than 3 players from one club.');
    return problems;
  }

  /** "1.0" / "0.5" -> tenths of £m. Multiples of 0.1 between 0 and 100 only. */
  function parseBank(text) {
    const t = String(text == null ? '' : text).trim();
    if (!t) return {ok: false, blank: true, msg: 'Enter your money in the bank, like 0.5'};
    if (!/^\d{1,3}(\.\d{1,2})?$/.test(t)) return {ok: false, msg: 'Enter your bank in £m, like 0.5'};
    const v = parseFloat(t), tenths = Math.round(v * 10);
    if (v > 100) return {ok: false, msg: 'The bank can be at most £100m'};
    if (Math.abs(v * 10 - tenths) > 1e-6) return {ok: false, msg: 'Use steps of £0.1m'};
    return {ok: true, tenths, value: tenths / 10};
  }

  const capHits = ft => Math.max(0, MAX_MOVES - ft);

  function strategyBlock(s) {
    if (s.strategy === 'sensible' && s.ft === 0)
      return {available: false, reason: 'Sensible plans use your free transfers, and you have none.'};
    if (s.strategy === 'hit' && capHits(s.ft) < 1)
      return {available: false, reason: 'With ' + s.ft + ' free transfers every move is already free, so there is no hit to weigh.'};
    return {available: true, reason: null};
  }

  /** Hits actually allowed. Sensible is always 0; with no free transfer, or on "Worth a hit?", at least 1. */
  function effHits(s) {
    if (s.strategy === 'sensible') return 0;
    let h = s.hits;
    if (h === null || h === undefined) h = (s.ft === 0 || s.strategy === 'hit') ? 1 : 0;
    if (s.ft === 0 || s.strategy === 'hit') h = Math.max(h, 1);
    return Math.min(h, capHits(s.ft));
  }
  // The points-hit choice is required: nothing is assumed for the user. ("Keep it sensible" means no hits, so it needs no choice.)
  const hitUnchosen = s => s.strategy !== 'sensible' && (s.hits === null || s.hits === undefined);
  const maxMoves = s => Math.max(1, Math.min(MAX_MOVES, s.ft + effHits(s)));

  function hitOptions(s) {
    const cap = capHits(s.ft), top = Math.max(cap, 0);
    const out = [];
    for (let h = 0; h <= top; h++) {
      let disabled = false;
      if (s.strategy === 'sensible') disabled = h !== 0;
      else if (s.ft === 0 && h === 0) disabled = true;
      else if (s.strategy === 'hit' && h === 0 && cap >= 1) disabled = true;
      const selected = s.strategy === 'sensible' ? h === 0 : s.hits === h;
      out.push({h, label: h ? '−' + (h * 4) : 'No', disabled, selected});
    }
    return out;
  }

  /** Name-only search. Sell: the user's squad. Buy: every other player, optionally one position. */
  function search(o) {
    const q = norm((o.q || '').trim()), ex = new Set(o.exclude || []), squad = new Set(o.squadIds);
    if (o.kind === 'buy' && !q) return [];
    let pool = o.kind === 'sell' ? o.squadIds.map(id => o.byId[id]).filter(Boolean)
                                 : o.players.filter(p => !squad.has(p.id));
    pool = pool.filter(p => !ex.has(p.id) && (!o.pos || p.pos === o.pos) && (!q || p.key.includes(q)));
    pool.sort((a, b) => ((q && a.key.startsWith(q)) ? 0 : 1) - ((q && b.key.startsWith(q)) ? 0 : 1)
                        || a.key.localeCompare(b.key) || b.price - a.price || a.id - b.id);
    return pool.slice(0, o.limit || 8);
  }

  const doneMoves = s => s.moves.filter(m => m.out && m.inn).map(m => [m.out, m.inn]);

  /** The exact body the planner API will receive, or the reasons it cannot be built yet. */
  function buildPlanRequest(s) {
    const problems = [];
    if (!s.strategy || !STRATEGIES[s.strategy]) problems.push('Pick a game plan.');
    const bank = parseBank(s.bank);
    if (!bank.ok) problems.push(bank.msg);
    if (hitUnchosen(s)) problems.push('Choose whether to allow a points hit.');
    if (!isInt(s.ft) || s.ft < 0 || s.ft > 3) problems.push('Free transfers must be 0 to 3.');
    if (problems.length) return {ok: false, problems};
    const block = strategyBlock(s);
    if (!block.available) return {ok: false, problems: [block.reason]};
    const hits = effHits(s);
    const body = {squad_ids: s.squad_ids.slice(), bank_m: bank.value, free_transfers: s.ft};
    const api = STRATEGIES[s.strategy].api;
    if (api) body.strategy = api;
    if (hits > 0) body.max_hits = hits;
    if (s.strategy === 'mind') {
      const half = s.moves.filter(m => (m.out || m.inn) && !(m.out && m.inn));
      if (half.length) problems.push('Finish or remove the move with only one player chosen.');
      const moves = doneMoves(s);
      if (!moves.length) problems.push('Choose a player to sell and one to buy.');
      if (moves.length > maxMoves(s)) problems.push('More moves than your free transfers and hits allow.');
      if (!problems.length) body.moves = moves;
    }
    return problems.length ? {ok: false, problems} : {ok: true, body};
  }

  /** Dev helper: a legal squad from the directory (2/5/5/3, at most 3 per club). */
  function sampleSquad(players) {
    const out = [], need = Object.assign({}, COMPOSITION), clubs = {};
    for (const p of players.slice().sort((a, b) => a.id - b.id)) {
      if (need[p.pos] > 0 && (clubs[p.team] || 0) < 3) { out.push(p.id); need[p.pos]--; clubs[p.team] = (clubs[p.team] || 0) + 1; }
      if (out.length === 15) break;
    }
    return out.length === 15 ? out : null;
  }


  /* ── Explore: turn the planner's real response into cards. Nothing here is invented: every figure is a response field. ── */
  const MINUS = '−';
  const num = v => typeof v === 'number' && isFinite(v);
  const sg = n => (n <= -0.05 ? MINUS : '+') + Math.abs(n).toFixed(1);
  const CONF = {HIGH: 'High', MEDIUM: 'Medium', LOW: 'Low'};

  /** What the default gain covers. The planner weights only the next gameweek unless told otherwise. */
  function gainBasis(weights, gw) {
    const w = Array.isArray(weights) ? weights : [1, 0, 0];
    const live = w.map((x, i) => (num(x) && x > 1e-9 ? i : -1)).filter(i => i >= 0);
    if (live.length === 1 && live[0] === 0) return {key: 'next', label: gw ? 'the next gameweek (GW' + gw + ')' : 'the next gameweek'};
    return {key: 'weighted', label: 'a weighted view of the next gameweeks'};
  }

  const pm = d => ({id: d.id, name: String(d.web_name || d.name || d.id), pos: d.position, team: d.team_short || null,
    price: num(d.price) ? d.price : null, code: isInt(d.photo_code) && d.photo_code > 0 ? d.photo_code : null,
    xp: Array.isArray(d.xpts) && num(d.xpts[0]) ? d.xpts[0] : null, status: typeof d.status === 'string' ? d.status : null,
    conf: CONF[d.confidence] || null, gaps: Array.isArray(d.projection_unavailable_gws) ? d.projection_unavailable_gws : []});
  const sig = p => (p.transfers || []).map(t => t.out.id + '>' + t.in.id).sort().join('|');
  const pts = v => Math.abs(v).toFixed(1) + (Math.abs(v).toFixed(1) === '1.0' ? ' point' : ' points');

  function planModel(p, ctx) {
    const moves = (p.transfers || []).map(t => ({out: pm(t.out), inn: pm(t.in), cmp: t.compare && Array.isArray(t.compare.rows) ? t.compare : null}));
    const n = moves.length, hits = p.hits || 0, hitPts = p.hit_points || 0;
    const before = num(p.projected_gain_before_hits) ? p.projected_gain_before_hits : null;
    const net = num(p.projected_gain_vs_hold) ? p.projected_gain_vs_hold : null;
    const o = p.outlook && Array.isArray(p.outlook.vs_hold) && p.outlook.vs_hold.length === 3 && p.outlook.vs_hold.every(num) ? p.outlook.vs_hold : null;
    const risks = (Array.isArray(p.risks) ? p.risks : []).filter(r => typeof r === 'string' && !/^Affordability/.test(r));
    const title = n === 0 ? 'Hold' : n === 1 ? 'Swap ' + moves[0].out.name + ' for ' + moves[0].inn.name
      : n + ' moves, ' + (hits === 0 ? 'no hit' : hits === 1 ? 'one hit' : hits + ' hits');
    let why, watch;
    if (n === 0) {
      why = 'Every plan is measured against this. Unused free transfers can carry over, up to the FPL limit.';
      watch = 'You miss out if a better move was available.';
    } else {
      why = before === null ? 'Projected gain unavailable.'
        : (before >= 0 ? 'Projected to score ' + pts(before) + ' more than holding' : 'Projected to score ' + pts(before) + ' fewer than holding') +
          ' for ' + ctx.basis.label + (hits && net !== null ? ', ' + sg(net) + ' after the ' + hitPts + '-point hit' : '') + '.';
      const best = moves.filter(m => m.out.xp !== null && m.inn.xp !== null)
        .sort((a, b) => (b.inn.xp - b.out.xp) - (a.inn.xp - a.out.xp))[0];
      if (best && best.inn.xp - best.out.xp > 0.04)
        why += ' ' + best.inn.name + ' is projected ' + (best.inn.xp - best.out.xp).toFixed(1) + ' more points than ' + best.out.name + ' next gameweek.';
      watch = risks.length ? risks.slice(0, 2).join(' ') : 'The model flagged no specific risks. It is still a projection.';
    }
    return {title, n, hits, hitPts, before, net, outlook: o, verdict: p.verdict && typeof p.verdict.label === 'string' ? p.verdict : null, outlookStatus: p.outlook && p.outlook.status || null, moves, why, watch, risks,
            costLabel: n === 0 ? 'Hold' : hits ? MINUS + hitPts + ' hit' : 'No hit', bankAfter: num(p.bank_after) ? p.bank_after : null,
            confidence: CONF[p.confidence] || null, freeLeft: num(p.free_transfers_remaining) ? p.free_transfers_remaining : null,
            belowBar: n > 0 && net !== null && net < ctx.minGain - 1e-9, dataComplete: p.data_complete !== false, sig: sig(p),
            ftUsed: num(p.free_transfers_used) ? p.free_transfers_used : null, xiIds: Array.isArray(p.xi_ids) ? p.xi_ids.filter(isInt) : null};
  }

  const STATUS_LABEL = {RECOMMENDED: ['Meets the bar', ''], BELOW_THRESHOLD: ['Below the bar', 'warn'], WORSE_THAN_HOLD: ['Projected worse than Hold', 'bad'],
                        INFEASIBLE: ['Can’t be done as asked', 'bad'], INCOMPLETE_DATA: ['Not enough data', 'bad']};

  /** Cards in display order: your move, its extra-transfers variant, the planner's ranked plans (top `limit`), then Hold. */
  function buildCards(resp, limit) {
    limit = limit || 3;
    const plan = resp.plan, gw = isInt(resp.gameweek) ? resp.gameweek : null, inputs = plan.inputs || {};
    const ctx = {gw, basis: gainBasis(inputs.weights, gw), minGain: num(inputs.min_gain) ? inputs.min_gain : 0.5};
    const rec = plan.recommendation || {};
    const recSig = rec.action === 'TRANSFER' && rec.plan ? sig(rec.plan) : null;
    const alts = Array.isArray(plan.alternatives) ? plan.alternatives : [];
    const cards = [];
    let mineSig = null;
    const req = plan.requested;
    if (req) {
      const model = req.plan ? planModel(req.plan, ctx) : null;
      mineSig = model ? model.sig : null;
      const idx = model ? alts.findIndex(a => sig(a) === mineSig) : -1;
      cards.push({id: 'mine', kind: 'mine', status: req.status, statusLabel: (STATUS_LABEL[req.status] || [req.status || '', ''])[0],
                  statusTone: (STATUS_LABEL[req.status] || ['', ''])[1], reason: req.reason || '', model, rank: idx >= 0 ? idx + 1 : null,
                  recommended: !!req.matches_overall_recommendation});
      if (req.with_additional_transfers)
        cards.push({id: 'extra', kind: 'extra', label: req.with_additional_transfers.label || '', model: planModel(req.with_additional_transfers, ctx), recommended: false});
    }
    alts.slice(0, limit).forEach((a, i) => {
      if (mineSig && sig(a) === mineSig) return;                       // already shown as "Your move"
      cards.push({id: 'r' + (i + 1), kind: 'rank', rank: i + 1, model: planModel(a, ctx), recommended: recSig === sig(a)});
    });
    cards.push({id: 'hold', kind: 'hold', model: planModel(plan.hold, ctx), recommended: rec.action === 'HOLD'});
    const squadPos = {};
    (Array.isArray(resp.squad) ? resp.squad : []).forEach(s => { if (s && isInt(s.id) && [1, 2, 3, 4].includes(s.position)) squadPos[s.id] = s.position; });
    return {cards, gw, basis: ctx.basis, minGain: ctx.minGain, totalRanked: alts.length, shownRanked: Math.min(limit, alts.length),
            info: {hitCost: num(inputs.hit_cost) ? inputs.hit_cost : null, priceSource: typeof inputs.price_source === 'string' ? inputs.price_source : '', squadPos},
            verdict: {action: rec.action || null, reason: rec.reason || ''},
            degraded: {status: resp.status, reasons: (resp.data && Array.isArray(resp.data.degraded_reasons) ? resp.data.degraded_reasons : []).filter(x => typeof x === 'string')},
            dataQuality: plan.data_quality ? {complete: plan.data_quality.complete !== false, note: String(plan.data_quality.note || '')} : {complete: true, note: ''},
            warnings: (Array.isArray(plan.warnings) ? plan.warnings : []).filter(x => typeof x === 'string')};
  }

  /** Interpret an HTTP status and parsed body from POST /api/transfer-plan. Server errors never show raw detail. */
  function parsePlanResponse(status, json) {
    if (status >= 200 && status < 300) {
      const ok = json && (json.status === 'OK' || json.status === 'DEGRADED') && json.plan && Array.isArray(json.plan.alternatives) &&
                 json.plan.hold && json.plan.recommendation;
      if (!ok) return {ok: false, kind: 'shape', message: 'We got an answer we couldn’t read. Please try again.'};
      return {ok: true, resp: json, view: buildCards(json)};
    }
    if ([400, 409, 413, 422].includes(status)) {
      const msg = json && typeof json.error === 'string' ? json.error : 'The planner couldn’t use those settings.';
      const details = json && Array.isArray(json.details) ? json.details.filter(d => typeof d === 'string').slice(0, 3) : [];
      return {ok: false, kind: 'request', message: msg + (details.length ? ' ' + details.join(' ') : '')};
    }
    return {ok: false, kind: 'upstream', message: 'FPL’s data isn’t available right now. Please try again in a moment.'};
  }

  /* ── Chunk 6: the share gate, "what goes into this", and the four tweaks ── */
  const UNLOCK_KEY = 'squadcheck.planner.unlocked.v1';
  const SITE = 'https://squadcheck.club';
  const shareText = (title, gw) => 'I’m weighing ' + title + (gw ? ' for GW' + gw : '') + ' on SquadCheck. Would you do it? ' + SITE;
  const waLink = text => 'https://wa.me/?text=' + encodeURIComponent(text);
  const STATUS = {a: 'Available', d: 'Doubtful', i: 'Injured', s: 'Suspended', u: 'Unavailable', n: 'Not available'};
  const money = t => (t === null || t === undefined ? '—' : '£' + (t / 10).toFixed(1) + 'm');

  /** Formation of the best XI the planner picked after the move, from the XI ids and the positions in the response. */
  function formation(m, squadPos) {
    if (!Array.isArray(m.xiIds) || m.xiIds.length !== 11 || !squadPos) return null;
    const pos = Object.assign({}, squadPos), c = {2: 0, 3: 0, 4: 0};
    m.moves.forEach(mv => { pos[mv.inn.id] = mv.inn.pos; });
    for (const id of m.xiIds) { const p = pos[id]; if (![1, 2, 3, 4].includes(p)) return null; if (p !== 1) c[p]++; }
    return c[2] + '-' + c[3] + '-' + c[4];
  }

  /** "What goes into this suggestion": every line is read from the planner response for this plan. */
  function whatGoesIn(card, view) {
    const m = card.model, out = [], gw = view.gw ? 'GW' + view.gw : 'the next gameweek', info = view.info || {};
    const xpLines = m.moves.filter(mv => mv.out.xp !== null && mv.inn.xp !== null)
      .map(mv => mv.inn.name + ' ' + mv.inn.xp.toFixed(1) + ' vs ' + mv.out.name + ' ' + mv.out.xp.toFixed(1));
    if (m.n === 0) {
      out.push({k: 'What Hold is', v: 'Your squad as it is, scored with the same projections as every other plan, so each plan can be compared with it.'});
    } else if (xpLines.length) {
      out.push({k: 'Projected points for ' + gw, v: 'xPts, ' + xpLines.join('; ') + '.'});
    }
    const f = formation(m, info.squadPos);
    out.push({k: 'Your best XI after the move', v: f ? 'The planner re-picked the strongest legal XI from your 15 (' + f + '), so bench changes count too.' : 'The planner re-picks the strongest legal XI from your 15, so bench changes count too.'});
    out.push({k: 'Points hits', v: m.hits ? m.hits + ' hit' + (m.hits === 1 ? '' : 's') + ' at ' + (num(info.hitCost) ? info.hitCost : 4) + ' points each = ' + MINUS + m.hitPts + ', taken off the gain.' : 'No points hit: this fits your free transfers.'});
    out.push({k: 'Money', v: (m.bankAfter !== null ? 'Bank after the move: ' + money(m.bankAfter) + '. ' : '') + (/estimate/i.test(info.priceSource || '') || !info.priceSource ? 'Current prices are used, not your selling prices, so this is an estimate.' : info.priceSource)});
    out.push({k: 'Club limit', v: 'No more than 3 players from one club.'});
    const flags = m.moves.filter(mv => mv.inn.status && mv.inn.status !== 'a').map(mv => mv.inn.name + ': ' + (STATUS[mv.inn.status] || mv.inn.status));
    if (m.n > 0) out.push({k: 'Availability', v: flags.length ? 'FPL availability flags on players you would buy. ' + flags.join('; ') + '.' : 'No availability flags on the players you would buy.'});
    const confs = m.moves.filter(mv => mv.inn.conf).map(mv => mv.inn.name + ': ' + mv.inn.conf);
    if (m.confidence || confs.length) out.push({k: 'Projection confidence', v: (m.confidence ? m.confidence + ' overall' : '') + (confs.length ? (m.confidence ? '. ' : '') + confs.join('; ') : '') + '. This is how sure the projection model is about the incoming players.'});
    out.push({k: 'Data completeness', v: m.dataComplete && view.dataQuality.complete ? 'Every player in this plan has a projection.' : (view.dataQuality.note || 'Some players are missing a projection.')});
    return out;
  }
  /* ── Your call ── */
  const REASONS = {Fixtures: 'The next few fixtures favour this move.', Minutes: 'I trust the minutes more than the alternative.', Form: 'Recent form backs it.',
                   Budget: 'It fits my bank without forcing anything else.', 'Gut feel': 'It is my gut call and I am happy to own it.'};
  const BENEFITS = [['A verdict, not a guess', 'After the gameweek, your call compared with doing nothing, in points.'],
                    ['No more \u201Cwhat if?\u201D', 'What Hold would have scored, so you know whether the move was worth it.'],
                    ['A record you can point to', 'Your calls, week by week, in one place.']];
  /** What the call screen and the share card say, built only from the plan's own figures. */
  function callCard(card, view) {
    const m = card.model, gwl = view.gw ? 'GW' + view.gw : 'the next gameweek';
    const moves = m.moves.map(mv => mv.out.name + ' \u2192 ' + mv.inn.name);
    const title = m.n === 0 ? 'Hold' : m.title;
    const proj = m.n === 0 ? 'Holding this week.' : m.net === null ? 'Projection unavailable.'
      : 'Planner projection: ' + sg(m.net) + ' points vs holding for ' + view.basis.label + (m.hits ? ', after the ' + m.hitPts + '-point hit' : '') + '. A projection, not a promise.';
    const risks = m.risks.length ? m.risks.slice(0, 3) : [m.n === 0 ? 'You miss out if a better move was available.' : 'The model flagged no specific risks. It is still a projection.'];
    return {title, moves, proj, risks, gwl, text: ['SquadCheck \u00B7 ' + gwl, 'My call: ' + title].concat(moves, [proj, 'Would you back it?', SITE]).join('\n')};
  }
  const NOT_FACTORED = [
    'Your actual selling prices. Current prices are used, so affordability is an estimate.',
    'Gameweeks 2 and 3. They appear only as a separate, provisional outlook that has not been backtested, and are not part of the headline gain.',
    'Players without a projection. They are never bought or sold in a ranked plan.'
  ];

  /** Body for one tweak, built from the request behind the plan on screen. Never changes the user's other choices. */
  function tweakRequest(base, tweak, ctx) {
    const body = JSON.parse(JSON.stringify(base)), problems = [];
    const ft = body.free_transfers, hitsNow = body.max_hits || 0, moves = ctx.moves || [];
    const named = new Set((body.moves || []).map(m => m[0]).concat(body.out_ids || []));
    if (tweak.kind === 'keep') {
      if (!moves.some(m => m[0] === tweak.out)) problems.push('Choose one of the players you would sell.');
      else if (named.has(tweak.out)) problems.push('You asked to sell this player, so you can’t also keep them.');
      else body.keep_ids = Array.from(new Set((body.keep_ids || []).concat([tweak.out])));
    } else if (tweak.kind === 'nohit') {
      if (!ctx.hits) problems.push('This plan already has no hit.');
      else { delete body.max_hits; if (body.strategy === 'everything') body.strategy = 'sensible'; }
    } else if (tweak.kind === 'hit') {
      if (ft + hitsNow + 1 > MAX_MOVES) problems.push('Already at the ' + MAX_MOVES + '-move limit (free transfers plus hits).');
      else { body.max_hits = hitsNow + 1; if (body.strategy === 'sensible') body.strategy = 'everything'; }
    } else if (tweak.kind === 'bring') {
      const i = tweak.index, mv = moves[i];
      if (!mv) problems.push('Choose which player to replace.');
      else if (!isInt(tweak.inn)) problems.push('Choose a replacement player.');
      else if (body.squad_ids.includes(tweak.inn)) problems.push('That player is already in your squad.');
      else if (moves.some((m, j) => j !== i && m[1] === tweak.inn) || tweak.inn === mv[1]) problems.push('Choose someone who isn’t already in this plan.');
      else if (ctx.pos && ctx.pos(tweak.inn) !== ctx.inPos[i]) problems.push('A replacement must play the same position.');
      else {
        const next = moves.map((m, j) => j === i ? [m[0], tweak.inn] : m.slice());
        const need = Math.max(0, next.length - ft);
        if (ft + Math.max(hitsNow, need) > MAX_MOVES) problems.push('That is more than the ' + MAX_MOVES + '-move limit.');
        else { body.moves = next; delete body.out_ids; delete body.in_ids; if (Math.max(hitsNow, need) > 0) body.max_hits = Math.max(hitsNow, need); }
      }
    } else problems.push('Unknown change.');
    return problems.length ? {ok: false, problems} : {ok: true, body};
  }
  /** Why a tweak cannot be offered at all for this plan (null = offered). */
  function tweakBlocked(base, kind, ctx) {
    if (kind === 'nohit' && !ctx.hits) return 'This plan already has no hit.';
    if (kind === 'hit' && base.free_transfers + (base.max_hits || 0) + 1 > MAX_MOVES) return 'Already at the ' + MAX_MOVES + '-move limit (free transfers plus hits).';
    return null;
  }

  /** The card to compare against: your literal moves when moves were named, otherwise the planner's best plan, else Hold. */
  function pickAfter(view, kind, hadMoves) {
    if (kind === 'bring' || hadMoves) return view.cards.find(c => c.kind === 'mine') || null;
    return view.cards.find(c => c.kind === 'rank') || view.cards.find(c => c.kind === 'hold') || null;
  }
  function compareModels(b, a) {
    const f = v => (v === null ? '—' : sg(v)), hit = m => (m.hitPts ? MINUS + m.hitPts : '0');
    const d = (a.net === null ? 0 : a.net) - (b.net === null ? 0 : b.net);
    const verdict = Math.abs(d) < 0.05 ? 'No change in net gain.' : d > 0 ? 'Net gain improves by ' + d.toFixed(1) + ' points.' : 'Net gain drops by ' + Math.abs(d).toFixed(1) + ' points.';
    return {rows: [['Plan', b.title, a.title], ['Net gain vs hold (next gameweek)', f(b.net), f(a.net)], ['Gain before hits', f(b.before), f(a.before)],
                   ['Hit cost', hit(b), hit(a)], ['Bank after (estimate)', money(b.bankAfter), money(a.bankAfter)]],
            verdict, tone: Math.abs(d) < 0.05 ? 'flat' : d > 0 ? 'up' : 'down'};
  }
  function tweakOutcome(view, kind, hadMoves, before) {
    const after = pickAfter(view, kind, hadMoves);
    if (!after) return {after: null, reason: 'The planner did not return a plan for this change.'};
    if (!after.model) return {after: null, reason: after.reason || 'That change can’t be done.', status: after.statusLabel};
    return Object.assign({after, status: after.statusLabel || ''}, compareModels(before, after.model));
  }

  return {POS, COMPOSITION, MAX_MOVES, HANDOFF_KEY, STATE_KEY, UNLOCK_KEY, STRATEGIES, norm, parseHandoff, indexDirectory,
          validateSquad, parseBank, capHits, strategyBlock, effHits, maxMoves, hitUnchosen, hitOptions, search, doneMoves,
          buildPlanRequest, sampleSquad, sg, gainBasis, buildCards, parsePlanResponse, shareText, waLink, STATUS, money, formation,
          devMode, whatGoesIn, NOT_FACTORED, REASONS, BENEFITS, callCard, tweakRequest, tweakBlocked, pickAfter, compareModels, tweakOutcome};
})();
/* CORE:END */
</script>

<script>
(function () {
  'use strict';
  const C = PlannerCore;
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
  const DEV = C.devMode(location.search, location.hostname);
  const RESULTS_KEY = 'squadcheck.results.v1';
  const hasResults = () => { try { return !!sessionStorage.getItem(RESULTS_KEY); } catch (e) { return false; } };
  if (hasResults()) { $('#brand').hidden = true; $('#backres').hidden = false; }
  const SIGNIN_LIVE = false;   // flip to true when sign-in ships: shows the benefits block, "Lock in my call" and the save sheet (all kept intact below)

  /* ── analytics: same PostHog project, session id and ?internal=1 flag as the results page, so a planner visit
        joins the same session. Sends from the live site only; everywhere else events are dropped. Never throws. ── */
  const _sc = (() => {
    const get = (area, k) => { try { return window[area].getItem(k); } catch (e) { return null; } };   // storage access itself can throw
    const sid = get('sessionStorage', 'sc_sid') || (() => {
      const id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Math.random().toString(36).slice(2, 11) + '-' + Date.now().toString(36);
      try { sessionStorage.setItem('sc_sid', id); } catch (e) { /* storage blocked */ }
      return id;
    })();
    let utm = {}, exp = {};
    try { utm = JSON.parse(get('sessionStorage', 'sc_utm') || '{}'); } catch (e) { /* ignore */ }
    try { exp = JSON.parse(get('sessionStorage', 'sc_exp') || '{}'); } catch (e) { /* ignore */ }
    try {
      const v = new URLSearchParams(location.search).get('internal');
      if (v === '1') localStorage.setItem('sc_internal', '1'); else if (v === '0') localStorage.removeItem('sc_internal');
    } catch (e) { /* ignore */ }
    return {session_id: sid, is_return: !!get('localStorage', 'sc_fv'), sc_version: '2.0', ...utm, ...exp, ...(get('localStorage', 'sc_internal') === '1' ? {internal: true} : {})};
  })();
  const LIVE_HOST = location.hostname === 'www.squadcheck.club' || location.hostname === 'squadcheck.club';
  const track = (e, p) => {
    try {
      const props = {..._sc, page: 'planner', ...(p || {})};
      if (LIVE_HOST && window.posthog && typeof posthog.capture === 'function') posthog.capture(e, props);
      if (window.__SC_TRACE && typeof window.__SC_TRACE.push === 'function') window.__SC_TRACE.push([e, props]);   // test hook: nothing sets it on the live site
    } catch (err) { /* analytics must never break the page */ }
  };
  try { if (LIVE_HOST && window.posthog && typeof posthog.register === 'function') posthog.register(_sc); } catch (e) { /* ignore */ }
  const STEPS = ['Game plan', 'Explore', 'Compare', 'Your call', 'Review'];

  const S = {phase: 'loading', msg: '', gameweek: null, dir: null, squad_ids: [], strategy: null, ft: 1, ftTouched: false, bank: '',
             hits: null, moves: [{out: null, inn: null}], dev: false, request: null, view: null, sel: null, cache: {}, work: null, work0: null, twk: null, twkOpen: null, twkSel: {out: null, index: 0, inn: null},
             twkId: 0, twkCtl: null, unlocked: false, gateOpened: false, popupBlocked: false, copied: false, shown: null,
             call: null, sheet: false, sharePreview: false, signinNote: false, copiedCard: false,
             reqId: 0, ctl: null, wait: null, t0: 0};

  /* ── storage (always optional) ── */
  const store = {
    get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) { /* storage blocked: the page still works */ } },
    remove(k) { try { sessionStorage.removeItem(k); } catch (e) { /* ignore */ } }
  };
  const squadKey = () => S.squad_ids.join(',');
  function saveState() {
    store.set(C.STATE_KEY, JSON.stringify({k: squadKey(), strategy: S.strategy, ft: S.ft, ftTouched: S.ftTouched, bank: S.bank, hits: S.hits, moves: S.moves}));
  }
  function restoreState() {
    let o; try { o = JSON.parse(store.get(C.STATE_KEY) || 'null'); } catch (e) { return; }
    if (!o || o.k !== squadKey()) return;
    if (o.strategy === null || C.STRATEGIES[o.strategy]) S.strategy = o.strategy;
    if (Number.isInteger(o.ft) && o.ft >= 0 && o.ft <= 3) S.ft = o.ft;
    S.ftTouched = o.ftTouched === true;
    if (typeof o.bank === 'string' && o.bank.length < 8) S.bank = o.bank;
    if (o.hits === null || (Number.isInteger(o.hits) && o.hits >= 0 && o.hits <= 3)) S.hits = o.hits;
    const ok = id => id === null || (Number.isInteger(id) && S.dir.byId[id]);
    if (Array.isArray(o.moves) && o.moves.length && o.moves.length <= 3 &&
        o.moves.every(m => m && ok(m.out) && ok(m.inn) && (m.out === null || S.squad_ids.includes(m.out)) && (m.inn === null || !S.squad_ids.includes(m.inn))))
      S.moves = o.moves.map(m => ({out: m.out, inn: m.inn}));
    clamp();
  }

  /* ── player rendering ── */
  window.__phErr = function (img) {
    const m = img.src.match(/premierleague25\/photos\/players\/110x140\/(\d+)\.png/);
    if (m && !img.getAttribute('data-t')) { img.setAttribute('data-t', '1'); img.src = 'https://resources.premierleague.com/premierleague/photos/players/110x140/p' + m[1] + '.png'; }
    else img.style.display = 'none';
  };
  const ini = n => n.replace(/[^A-Za-z]/g, '').slice(0, 2).toUpperCase();
  const photo = (p, cls) => '<span class="phw ' + (cls || '') + '" data-ini="' + ini(p.name) + '">' + (p.code
    ? '<img src="https://resources.premierleague.com/premierleague25/photos/players/110x140/' + p.code + '.png" loading="lazy" alt="" onerror="window.__phErr(this)">' : '') + '</span>';
  const meta = p => esc((p.teamShort || '') + (p.teamShort ? ' · ' : '') + C.POS[p.pos] + ' · £' + (p.price / 10).toFixed(1) + 'm');
  const P = id => S.dir.byId[id];

  /* ── state rules ── */
  function clamp() {
    const cap = C.capHits(S.ft);

  /* ── data ── */
  async function boot() {
    S.phase = 'loading'; render();
    S.dev = false; S.t0 = 0; S.unlocked = store.get(C.UNLOCK_KEY) === '1';
    const ho = C.parseHandoff(store.get(C.HANDOFF_KEY), Date.now());
    if (ho.ok && ho.dev && !DEV) { store.remove(C.HANDOFF_KEY); store.remove(C.STATE_KEY); ho.ok = false; }   // a sample squad never enters the normal journey
    if (!ho.ok) { S.phase = 'empty'; render(); track('planner_opened', {state: 'no_handover', reason: store.get(C.HANDOFF_KEY) == null ? 'missing' : ho.reason, dev: DEV}); if (DEV) loadDirectoryOnly(); return; }
    const dir = await loadDirectory(); if (!dir) return;
    const problems = C.validateSquad(ho.squad_ids, dir.byId);
    if (problems.length) { S.phase = 'error'; S.msg = 'We couldn’t read your squad (' + problems[0] + ') Please check your team again.'; render(); track('planner_error', {where: 'squad', message: String(problems[0]).slice(0, 120)}); return; }
    S.dir = dir; S.squad_ids = ho.squad_ids; S.gameweek = ho.gameweek || dir.gameweek; S.dev = ho.dev;
    restoreState(); S.phase = 'ready'; render();
    track('planner_opened', {state: 'ready', gw: S.gameweek, dev: S.dev, restored: !!(S.strategy || S.bank)});
  }
  async function loadDirectory() {
    try {
      const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 20000);
      const r = await fetch('/api/players', {signal: ctl.signal}); clearTimeout(t);
      const dir = C.indexDirectory(r.ok ? await r.json() : null);
      if (!dir.ok) throw new Error('bad directory');
      return dir;
    } catch (e) {
      S.phase = 'error'; S.msg = 'The FPL player list isn’t available right now. Please try again in a moment.'; render(); track('planner_error', {where: 'directory'}); return null;
    }
  }
  async function loadDirectoryOnly() { const d = await loadDirectory(); if (d) { S.dir = d; S.phase = 'empty'; render(); } }
  async function useSample() {
    if (!S.dir) { const d = await loadDirectory(); if (!d) return; S.dir = d; }
    const ids = C.sampleSquad(S.dir.players); if (!ids) return;
    store.set(C.HANDOFF_KEY, JSON.stringify({v: 1, squad_ids: ids, gameweek: S.dir.gameweek, created: Date.now(), dev: true}));
    boot();
  }

  /* ── requests (shared by Explore and the tweaks) ── */
  async function fetchPlans(key, signal) {
    try {
      const r = await fetch('/api/transfer-plan', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: key, signal});
      let j = null; try { j = await r.json(); } catch (e) { /* not JSON */ }
      return C.parsePlanResponse(r.status, j);
    } catch (e) {
      const aborted = e && e.name === 'AbortError';
      return {ok: false, kind: aborted ? 'timeout' : 'network', message: aborted ? 'This is taking longer than expected. Please try again.' : 'We couldn’t reach SquadCheck. Check your connection and try again.'};
    }
  }
  const cacheGet = key => { const e = S.cache[key]; return e && Date.now() - e.t < 240000 ? e.parsed : null; };
  const cacheSet = (key, parsed) => {
    S.cache[key] = {t: Date.now(), parsed};
    const ks = Object.keys(S.cache); if (ks.length > 10) delete S.cache[ks.sort((a, b) => S.cache[a].t - S.cache[b].t)[0]];
  };

  /* ── tweaks: each one is a real planner request; nothing is shown as the new answer until it arrives ── */
  function twkSpec() { const k = S.twkOpen; return k === 'keep' ? {kind: k, out: S.twkSel.out} : k === 'bring' ? {kind: k, index: S.twkSel.index, inn: S.twkSel.inn} : {kind: k}; }
  function cancelTweak() { S.twkId++; if (S.twkCtl) S.twkCtl.abort(); S.twkCtl = null; if (S.twk && S.twk.state === 'loading') S.twk = null; }
  function finishTweak(kind, body, parsed) {
    S.twk = {state: 'done', kind, body, parsed, outcome: C.tweakOutcome(parsed.view, kind, Array.isArray(body.moves), wm())};
    track('planner_tweak_result', {kind, tone: S.twk.outcome.tone || null, has_plan: !!S.twk.outcome.after});
    render();
  }
  async function runTweak(force) {
    if (S.twk && S.twk.state === 'loading') return;                          // never two tweak requests at once
    const kind = S.twkOpen, built = C.tweakRequest(S.work.request, twkSpec(), tweakCtx());
    if (!built.ok) { S.twk = {state: 'error', kind, msg: built.problems[0]}; render(); return; }
    const key = JSON.stringify(built.body), cached = force ? null : cacheGet(key), id = ++S.twkId;
    if (cached) { finishTweak(kind, built.body, cached); return; }
    if (S.twkCtl) S.twkCtl.abort();
    const ctl = new AbortController(); S.twkCtl = ctl;
    const timer = setTimeout(() => ctl.abort(), 65000);
    S.twk = {state: 'loading', kind, body: built.body}; render();
    const parsed = await fetchPlans(key, ctl.signal);
    clearTimeout(timer);
    if (id !== S.twkId) return;                                              // cancelled or replaced: ignore the late answer
    if (!parsed.ok) { S.twk = {state: 'error', kind, msg: parsed.message}; render(); track('planner_tweak_failed', {kind, reason: parsed.kind || 'error'}); return; }
    cacheSet(key, parsed); finishTweak(kind, built.body, parsed);
  }
  function openInspect(c) {
    cancelTweak();
    track('planner_plan_inspected', {rank: c.rank || null, kind: c.kind, recommended: !!c.recommended, verdict: c.model && c.model.verdict ? c.model.verdict.tier : null,
                                     gain: c.model && typeof c.model.net === 'number' ? c.model.net : null, gated: !S.unlocked && c.kind !== 'hold'});
    S.work0 = S.work = {request: S.request, resp: S.resp, view: S.view, cardId: c.id, applied: []};
    S.twk = null; S.twkOpen = null; S.twkSel = {out: c.model.moves.length === 1 ? c.model.moves[0].out.id : null, index: 0, inn: null};
    if (!S.unlocked && c.kind !== 'hold') { S.gateOpened = false; S.popupBlocked = false; S.copied = false; S.phase = 'gate'; }   // Hold is never gated
    else S.phase = 'compare';
    render();
  }

  /* ── plans (POST /api/transfer-plan) ── */
  function stopWait() { if (S.wait) { clearInterval(S.wait); S.wait = null; } }
  function showView(parsed, meta) {
    S.resp = parsed.resp; S.view = parsed.view;
    const first = S.view.cards.find(c => c.model);
    const top = S.view.cards.find(c => c.kind === 'rank');
    track('planner_plans_loaded', {gw: S.view.gw, status: S.view.degraded.status, n_ranked: S.view.totalRanked, strategy: S.strategy, free_transfers: S.ft, max_hits: S.hits,
      top_gain: top && top.model && typeof top.model.net === 'number' ? top.model.net : null, top_verdict: top && top.model && top.model.verdict ? top.model.verdict.tier : null,
      recommended_action: S.view.verdict.action, cached: !!(meta && meta.cached), ms: meta && meta.ms != null ? meta.ms : null});
    S.sel = first ? first.id : null;
    S.phase = 'explore'; render();
  }
  async function loadPlans(force) {
    const key = JSON.stringify(S.request), now = Date.now();
    if (S.work0 && JSON.stringify(S.work0.request) !== key) { S.work = S.work0 = null; S.call = null; S.twk = null; S.twkOpen = null; }   // new settings: the old working plan no longer applies
    const hit = force ? null : cacheGet(key);
    if (hit) { track('planner_plans_requested', {strategy: S.strategy, free_transfers: S.ft, max_hits: S.hits, cached: true}); showView(hit, {cached: true}); return; }
    const id = ++S.reqId;
    if (S.ctl) S.ctl.abort();
    const ctl = new AbortController(); S.ctl = ctl;
    const timer = setTimeout(() => ctl.abort(), 65000);
    S.phase = 'ploading'; S.t0 = now; render();
    track('planner_plans_requested', {strategy: S.strategy, free_transfers: S.ft, max_hits: S.hits, cached: false, retry: !!force});
    stopWait();
    S.wait = setInterval(() => { const el = $('#waitmsg'); if (el) el.textContent = (Date.now() - S.t0) > 10000 ? 'Still working. Thanks for waiting.' : 'This can take up to a minute the first time.'; }, 1000);
    const parsed = await fetchPlans(key, ctl.signal);
    clearTimeout(timer);
    if (id !== S.reqId) return;                    // the user left while waiting
    stopWait(); S.t0 = 0;
    if (parsed.ok) { cacheSet(key, parsed); showView(parsed, {cached: false, ms: Date.now() - now}); }
    else { S.phase = 'xerror'; S.msg = parsed.message; render(); track('planner_plans_failed', {reason: parsed.kind || 'error', ms: Date.now() - now}); }
  }
  function leavePlans() { S.reqId++; if (S.ctl) S.ctl.abort(); stopWait(); S.t0 = 0; cancelTweak(); }

  /* ── combobox (managed by hand so typing never re-renders the field) ── */
  const combo = {id: null, hi: 0, results: []};
  function comboOpen(input) {
    const id = input.dataset.combo, kind = input.dataset.kind, pos = +input.dataset.pos || null;
    const ex = id === 'bring' ? (S.work ? wm().moves.map(x => x.inn.id) : []) : S.moves.map(m => kind === 'sell' ? m.out : m.inn).filter(Boolean);
    combo.id = id; combo.hi = 0;
    combo.results = C.search({kind, q: input.value, pos, exclude: ex, squadIds: S.squad_ids, byId: S.dir.byId, players: S.dir.players});
    const box = $('#cb-' + id), list = $('#cl-' + id);
    list.innerHTML = optionsHtml(id, combo.results, input.value, kind, pos);
    box.classList.add('open'); input.setAttribute('aria-expanded', 'true');
    highlight(id);
  }
  function comboClose(id) {
    const box = $('#cb-' + id); if (!box) return;
    box.classList.remove('open'); const i = box.querySelector('input'); if (i) { i.setAttribute('aria-expanded', 'false'); i.removeAttribute('aria-activedescendant'); }
  }
  function highlight(id) {
    const list = $('#cl-' + id); if (!list) return;
    list.querySelectorAll('.copt').forEach((el, i) => el.classList.toggle('hi', i === combo.hi));
    const input = $('#cb-' + id + ' input'), el = list.querySelectorAll('.copt')[combo.hi];
    if (el) { input.setAttribute('aria-activedescendant', el.id); el.scrollIntoView({block: 'nearest'}); } else input.removeAttribute('aria-activedescendant');
  }
  function pick(id, pid) {
    if (id === 'bring') { S.twkSel.inn = pid; S.twk = null; render(); return; }
    const kind = id.slice(0, -1), i = +id.slice(-1);
    if (kind === 'sell') { S.moves[i].out = pid; const inn = S.moves[i].inn; if (inn && P(inn).pos !== P(pid).pos) S.moves[i].inn = null; }
    else S.moves[i].inn = pid;
    saveState(); render();
  }

  /* ── events ── */
  function act(a, v, el) {
    track('planner_action', {act: a, v: v == null ? null : String(v).slice(0, 40), phase: S.phase});
    if (ACT_EVENTS[a]) track(ACT_EVENTS[a], {...planCtx(), ...(a === 'twk' ? {kind: v} : a === 'twkrun' || a === 'twkretry' ? {kind: S.twkOpen} : {})});
    switch (a) {
      case 'strat': S.strategy = v; clamp(); saveState(); render(); break;
      case 'ft': S.ft = Math.max(0, Math.min(3, S.ft + (+v))); S.ftTouched = true; clamp(); saveState(); render(); break;
      case 'hits': S.hits = +v; clamp(); saveState(); render(); break;
      case 'addmove': if (S.moves.length < C.maxMoves(model())) S.moves.push({out: null, inn: null}); saveState(); render(); break;
      case 'rmmove': S.moves.splice(+v, 1); if (!S.moves.length) S.moves = [{out: null, inn: null}]; saveState(); render(); break;
      case 'cpick': pick(el.dataset.id, +v); break;
      case 'cclear': { if (el.dataset.id === 'bring') { S.twkSel.inn = null; S.twk = null; render(); break; } const id = el.dataset.id, i = +id.slice(-1); if (id.startsWith('sell')) S.moves[i].out = null; else S.moves[i].inn = null; saveState(); render(); break; }
      case 'next': { const r = C.buildPlanRequest(model()); if (r.ok) { S.request = r.body; loadPlans(false); } break; }
      case 'retryplans': loadPlans(true); break;
      case 'cancel': case 'edit': leavePlans(); S.phase = 'ready'; render(); break;
      case 'pickplan': { if (v === 'work') { if (S.work && S.work.applied.length) { S.sel = 'work'; render(); } break; } const c = S.view.cards.find(x => x.id === v); if (c && c.model) { S.sel = v; render(); } break; }
      case 'inspect': {
        if (S.sel === 'work' && S.work && S.work.applied.length) { S.twk = null; S.twkOpen = null; S.phase = 'compare'; render(); break; }   // keep the edited plan
        const c = S.view.cards.find(x => x.id === S.sel); if (c && c.model) openInspect(c); break;
      }
      case 'toexplore': cancelTweak(); if (S.work && S.work.applied.length) S.sel = 'work'; S.sheet = false; S.phase = 'explore'; render(); break;
      case 'tocompare': S.phase = 'compare'; render(); break;
      case 'backplan': ensureCall(workCard()); S.sharePreview = false; S.sheet = false; S.signinNote = false; S.copiedCard = false; S.phase = 'call'; render(); break;
      case 'wa': {
        const text = C.shareText(wm().title, S.view.gw); let w = null;
        try { w = window.open(C.waLink(text), '_blank'); if (w) w.opener = null; } catch (e) { w = null; }
        S.gateOpened = true; S.popupBlocked = !w; render(); break;
      }
      case 'wacopy': {
        const text = C.shareText(wm().title, S.view.gw);
        try { navigator.clipboard.writeText(text).then(() => { S.copied = true; render(); }, () => { S.copied = false; }); } catch (e) { S.copied = false; }
        break;
      }
      case 'wadone': S.unlocked = true; store.set(C.UNLOCK_KEY, '1'); S.phase = 'compare'; render(); break;
      case 'twk': {
        const wasOpen = S.twkOpen === v;
        if (S.twk && S.twk.state === 'loading') { if (wasOpen) { cancelTweak(); S.twkOpen = null; render(); } break; }
        S.twkOpen = wasOpen ? null : v; S.twk = null;
        S.twkSel = {out: wm().moves.length === 1 ? wm().moves[0].out.id : null, index: 0, inn: null}; render(); break;
      }
      case 'twkpick': S.twkSel.out = +v; S.twk = null; render(); break;
      case 'twkidx': S.twkSel.index = +v; S.twkSel.inn = null; S.twk = null; render(); break;
      case 'twkrun': runTweak(false); break;
      case 'twkretry': runTweak(true); break;
      case 'twkcancel': cancelTweak(); render(); break;
      case 'twkclose': S.twk = null; S.twkOpen = null; render(); break;
      case 'twkuse': {
        const t = S.twk;
        if (t && t.state === 'done' && t.outcome.after) {
          S.work = {request: t.body, resp: t.parsed.resp, view: t.parsed.view, cardId: t.outcome.after.id, applied: S.work.applied.concat([TWEAK_NAMES[t.kind]])};
          S.twk = null; S.twkOpen = null; S.twkSel = {out: null, index: 0, inn: null}; render();
        }
        break;
      }
      case 'twkreset': cancelTweak(); S.work = S.work0; S.twk = null; S.twkOpen = null; render(); break;
      case 'reason': { const r = S.call; if (!r) break; const i = r.reasons.indexOf(v); if (i > -1) r.reasons.splice(i, 1); else { r.reasons.push(v); const ph = C.REASONS[v]; if (ph && !r.why.includes(ph)) r.why = (r.why ? r.why + ' ' : '') + ph; } render(); break; }
      case 'sharetoggle': S.sharePreview = !S.sharePreview; S.copiedCard = false; render(); break;
      case 'copycard': { const k = C.callCard(workCard(), S.view); try { navigator.clipboard.writeText(k.text).then(() => { S.copiedCard = true; render(); }, () => { /* blocked */ }); } catch (e) { /* clipboard unavailable */ } break; }
      case 'pfb': if (S.call && !S.call.fb && ['loved', 'useful', 'ok', 'bad'].includes(v)) { S.call.fb = v; track('planner_feedback_' + v, {rating: v, ...planCtx()}); render(); } break;
      case 'locksheet': S.sheet = true; render(); break;
      case 'sheetclose': S.sheet = false; render(); break;
      case 'signinstub': S.sheet = false; S.signinNote = true; render(); break;       // a stub: nothing is saved or sent
      case 'step': if (+v === 1) { leavePlans(); S.phase = 'ready'; render(); } else if (+v === 2 && S.view) { cancelTweak(); S.phase = 'explore'; render(); } else if (+v === 3 && S.work) { S.phase = 'compare'; render(); } break;
      case 'retry': boot(); break;
      case 'sample': useSample(); break;
    }
  }
  { const br = $('#backres'); if (br && br.addEventListener) br.addEventListener('click', () => track('planner_back_to_results', {phase: S.phase})); }
  document.addEventListener('pointerdown', e => { if (e.target.closest('.clist')) e.preventDefault(); });   // keep focus in the field while choosing
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el || el.tagName === 'INPUT') return;
    act(el.dataset.act, el.dataset.v, el);
  });
  document.addEventListener('focusin', e => { if (e.target.matches && e.target.matches('input[data-combo]')) comboOpen(e.target); });
  document.addEventListener('focusout', e => { if (e.target.matches && e.target.matches('input[data-combo]')) setTimeout(() => comboClose(e.target.dataset.combo), 120); });
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.matches && t.matches('input[data-combo]')) { if (!S.searched) { S.searched = true; track('planner_player_search', {field: t.dataset.combo}); } comboOpen(t); }
    else if (t.id === 'why' && S.call) { S.call.why = t.value; }
    else if (t.id === 'bank') { S.bank = t.value; saveState(); const ok = C.parseBank(S.bank).ok; if (ok && !S.bankTracked) { S.bankTracked = true; track('planner_bank_entered', {bank_m: C.parseBank(S.bank).value}); } t.parentElement.classList.toggle('bad', !ok && S.bank.trim() !== ''); refreshCta(); }
  });
  document.addEventListener('keydown', e => {
    const t = e.target;
    if (e.key === 'Escape' && S.sheet) { S.sheet = false; render(); return; }
    if ((e.key === 'Enter' || e.key === ' ') && t.matches && t.matches('.plan[data-act="pickplan"]')) { e.preventDefault(); act('pickplan', t.dataset.v, t); return; }
    if (!(t.matches && t.matches('input[data-combo]'))) return;
    const id = t.dataset.combo, n = combo.results.length;
    if (e.key === 'ArrowDown') { e.preventDefault(); if (n) { combo.hi = (combo.hi + 1) % n; highlight(id); } }
    else if (e.key === 'ArrowUp') { e.preventDefault(); if (n) { combo.hi = (combo.hi - 1 + n) % n; highlight(id); } }
    else if (e.key === 'Enter') { e.preventDefault(); if (n) pick(id, combo.results[combo.hi].id); }
    else if (e.key === 'Escape') { comboClose(id); }
  });
  function refreshCta() {   // bank typing must not re-render the field and drop focus
    const r = C.buildPlanRequest(model()), b = document.querySelector('[data-act="next"]'), h = document.querySelector('.stack .help');
    if (b) b.disabled = !r.ok;
    if (h) h.textContent = helpText(r);
    const sub = document.querySelector('#bankhint'), bank = C.parseBank(S.bank);
    if (sub) sub.innerHTML = bankHint(bank);
    const rb = document.querySelector('#row-bank'); if (rb) rb.classList.toggle('need', !bank.ok);
  }

  boot();
})();
</script>
</body>
</html>
